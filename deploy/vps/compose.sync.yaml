# Used by scripts/deploy.sh, which copies it to the server as
# compose.override.yaml: run the builds synced to ./app instead of the
# published images. The node runs on the Playwright image (Node plus a
# matching Chromium).
services:
  cloud:
    image: node:22-alpine
    pull_policy: missing
    working_dir: /app/apps/cloud
    command: ["node", "--disable-warning=ExperimentalWarning", "dist/node/index.js"]
    volumes:
      - ./app:/app:ro
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8700/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s

  node:
    image: mcr.microsoft.com/playwright:v1.56.1-noble
    pull_policy: missing
    working_dir: /app/apps/node
    command: ["node", "--disable-warning=ExperimentalWarning", "dist/index.js"]
    volumes:
      - ./app:/app:ro
    environment:
      NODE_ENV: production
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
