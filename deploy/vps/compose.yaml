# The Vireo cloud on a VPS: GitHub sign-in, the nodes each account owns, and
# the relay between the app and nodes. The app itself is served elsewhere
# (Vercel); see deploy/README.md.
#
#   cp .env.example .env              # VIREO_DOMAIN
#   cp cloud.env.example cloud.env    # app address, GitHub OAuth app
#   docker compose up -d
#
#   cloud    the cloud on 127.0.0.1:8700, behind caddy
#   caddy    TLS for VIREO_DOMAIN, proxying to the cloud (WebSockets and SSE pass through)
#   node     optional, profile "node": a node of your own on this server, linked
#            to your account like any other (docker compose logs node for its code)
#   litellm  optional, profile "litellm": for providers without an OpenAI-compatible API
services:
  cloud:
    image: ${VIREO_CLOUD_IMAGE:-ghcr.io/abcdlsj/vireo-cloud:latest}
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8700:8700"
    volumes:
      # Accounts, nodes and the key that signs node tokens.
      - ./data/cloud:/data
    env_file:
      - path: ./cloud.env
        required: false
    environment:
      VIREO_CLOUD_PORT: "8700"
      VIREO_CLOUD_DATA_DIR: /data
      VIREO_CLOUD_URL: https://${VIREO_DOMAIN:?Set VIREO_DOMAIN in .env}

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      VIREO_DOMAIN: ${VIREO_DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - cloud

  node:
    profiles: ["node"]
    image: ${VIREO_NODE_IMAGE:-ghcr.io/abcdlsj/vireo-node:latest}
    init: true
    restart: unless-stopped
    shm_size: 1gb
    volumes:
      # Everything the node keeps: its link, database, files, browser profile, keys.
      - ./data/node:/data
    env_file:
      - path: ./node.env
        required: false
    environment:
      VIREO_DATA_DIR: /data
      VIREO_CLOUD_URL: http://cloud:8700
      VIREO_NAME: ${VIREO_NAME:-}
      TZ: ${TZ:-UTC}
    depends_on:
      - cloud

  litellm:
    profiles: ["litellm"]
    image: ghcr.io/berriai/litellm:main-v1.83.14-stable
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ../litellm.config.yaml:/app/config.yaml:ro
    env_file:
      - path: ./node.env
        required: false

volumes:
  caddy-data:
  caddy-config:
