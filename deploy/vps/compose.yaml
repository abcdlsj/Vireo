# Vireo host on a VPS. The UI is normally served elsewhere (Vercel,
# Cloudflare) and pairs with this host; see deploy/README.md.
#
#   cp .env.example .env            # optional: profiles, domain, port
#   cp host.env.example host.env    # model endpoint and keys (or set them in Settings)
#   docker compose up -d
#   docker compose logs host        # pairing code
#
#   host     the headless host (agent + API) on VIREO_PORT (8787); the only
#            service that runs by default
#   caddy    optional, profile "https": TLS for VIREO_DOMAIN, proxying to the host
#   app      optional, profile "app": the UI on this server too, on VIREO_APP_PORT,
#            proxying /api to the host (for setups without a domain)
#   litellm  optional, profile "litellm": for providers without an OpenAI-compatible API
#
# Profiles come from COMPOSE_PROFILES in .env. An app served over HTTPS can
# only use HTTPS hosts: use the https profile, your own proxy, or
# `tailscale serve --bg 8787`.
services:
  host:
    image: ${VIREO_IMAGE:-ghcr.io/abcdlsj/vireo-host:latest}
    init: true
    restart: unless-stopped
    shm_size: 1gb
    ports:
      - "${VIREO_BIND:-0.0.0.0}:${VIREO_PORT:-8787}:8787"
    volumes:
      # Everything Vireo keeps: database, files, browser profile, keys.
      - ./data:/data
    env_file:
      - path: ./host.env
        required: false
    environment:
      VIREO_PORT: "8787"
      VIREO_DATA_DIR: /data
      VIREO_PUBLIC_URL: ${VIREO_PUBLIC_URL:-${VIREO_DOMAIN:+https://${VIREO_DOMAIN}}}
      VIREO_APP_URL: ${VIREO_APP_URL:-}
      VIREO_NAME: ${VIREO_NAME:-}
      TZ: ${TZ:-UTC}

  caddy:
    profiles: ["https"]
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      VIREO_DOMAIN: ${VIREO_DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - host

  app:
    profiles: ["app"]
    image: ${VIREO_WEB_IMAGE:-ghcr.io/abcdlsj/vireo-web:latest}
    init: true
    restart: unless-stopped
    ports:
      - "${VIREO_APP_BIND:-0.0.0.0}:${VIREO_APP_PORT:-8780}:8780"
    environment:
      VIREO_HOST_URL: http://host:8787
    depends_on:
      - host

  litellm:
    profiles: ["litellm"]
    image: ghcr.io/berriai/litellm:main-v1.83.14-stable
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ../litellm.config.yaml:/app/config.yaml:ro
    env_file:
      - path: ./host.env
        required: false

volumes:
  caddy-data:
  caddy-config:
