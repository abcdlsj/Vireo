# Vireo on a server, from a build made elsewhere (scripts/deploy.sh).
# Nothing is built here: ./app holds dist/, web/serve.mjs and production
# node_modules (pure JS), and the Playwright image supplies Node and a
# Chromium that matches the playwright package.
#
#   host  the headless host (agent + API); reachable only by the app
#   app   the UI; proxies /api to the host, published on VIREO_APP_BIND:VIREO_APP_PORT
#
# Model keys and other host settings: ./host.env (optional), or Settings in the app.
x-runtime: &runtime
  image: mcr.microsoft.com/playwright:v1.56.1-noble
  working_dir: /app
  init: true
  restart: unless-stopped
  volumes:
    - ./app:/app:ro

services:
  host:
    <<: *runtime
    command: ["node", "--disable-warning=ExperimentalWarning", "dist/server/index.js"]
    shm_size: 1gb
    volumes:
      - ./app:/app:ro
      # Everything Vireo keeps: database, files, browser profile, keys.
      - ./data:/data
    env_file:
      - path: ./host.env
        required: false
    environment:
      NODE_ENV: production
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      VIREO_PORT: "8787"
      VIREO_DATA_DIR: /data
      VIREO_PUBLIC_URL: ${VIREO_PUBLIC_URL:-}
      VIREO_NAME: ${VIREO_NAME:-}
      TZ: ${TZ:-UTC}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s

  app:
    <<: *runtime
    command: ["node", "web/serve.mjs"]
    ports:
      - "${VIREO_APP_BIND:-127.0.0.1}:${VIREO_APP_PORT:-8780}:8780"
    environment:
      VIREO_HOST_URL: http://host:8787
    depends_on:
      - host
