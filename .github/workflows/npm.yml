name: Publish @abcdlsj/vireo-node

# Publishes apps/node to npm as `@abcdlsj/vireo-node` on version tags, so anyone can
# run a node with `npx @abcdlsj/vireo-node`. Needs an NPM_TOKEN repository secret
# (an npm granular token with publish rights to the package).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm run build -w @abcdlsj/vireo-node
      - run: npm publish -w @abcdlsj/vireo-node --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
