name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer commit on the same branch or pull request makes the older run moot;
# cancel it rather than hold a runner for twenty minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run acceptance
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance
          path: |
            acceptance-report.md
            test-results/
          if-no-files-found: ignore
