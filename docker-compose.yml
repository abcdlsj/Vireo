# All of Vireo on one machine, built from source: the cloud (sign-in, the
# app, the relay), one node, and a LiteLLM proxy.
#
#   cp .env.example .env     # sign-in, a provider key and a model
#   docker compose up -d
#   open http://localhost:8700, sign in, then approve the node:
#   docker compose logs node  # shows the link and its code
#
# The usual setup is different: the official cloud and app, and a node per
# person started with `npx vireo-node`. See README.md and deploy/README.md.
#
# Using OpenAI (or any compatible endpoint) directly? Set VIREO_LLM_BASE_URL
# and VIREO_LLM_API_KEY in .env and skip LiteLLM: docker compose up -d cloud node
services:
  cloud:
    build:
      context: .
      target: cloud
    image: vireo-cloud:local
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8700:8700"
    volumes:
      - ./data/cloud:/data
    environment:
      VIREO_CLOUD_URL: http://localhost:8700
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      VIREO_DEV_LOGIN: ${VIREO_DEV_LOGIN:-}

  node:
    build:
      context: .
      target: node
    image: vireo-node:local
    init: true
    restart: unless-stopped
    shm_size: 1gb
    volumes:
      # Everything the node keeps: its link, database, files, browser profile, keys.
      - ./data/node:/data
    environment:
      VIREO_CLOUD_URL: http://cloud:8700
      VIREO_LLM_BASE_URL: ${VIREO_LLM_BASE_URL:-http://litellm:4000/v1}
      VIREO_LLM_API_KEY: ${VIREO_LLM_API_KEY:-${LITELLM_MASTER_KEY:-sk-vireo-local}}
      VIREO_MODEL: ${VIREO_MODEL:-}
      VIREO_FAST_MODEL: ${VIREO_FAST_MODEL:-}
      VIREO_NAME: ${VIREO_NAME:-}
      TZ: ${TZ:-UTC}
    depends_on:
      cloud:
        condition: service_started
      litellm:
        condition: service_started
        required: false

  litellm:
    image: ghcr.io/berriai/litellm:main-v1.83.14-stable
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ./deploy/litellm.config.yaml:/app/config.yaml:ro
    env_file:
      - path: .env
        required: false
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-vireo-local}
    extra_hosts:
      - "host.docker.internal:host-gateway"
