# Vireo on one machine: host, app and a LiteLLM proxy, built from source.
#
#   cp .env.example .env    # add at least one provider key and pick a model
#   docker compose up -d    # then open http://localhost:8780
#
# host is the agent + API (:8787); app is the UI (:8780), proxying /api to the
# host. For a VPS that only runs the host behind HTTPS, use deploy/vps.
#
# Using OpenAI (or any compatible endpoint) directly? Set VIREO_LLM_BASE_URL
# and VIREO_LLM_API_KEY in .env and skip LiteLLM: docker compose up -d host app
services:
  host:
    build:
      context: .
      target: host
    image: vireo-host:local
    init: true
    restart: unless-stopped
    shm_size: 1gb
    ports:
      - "8787:8787"
    volumes:
      # Everything Vireo keeps: database, files, browser profile, keys.
      - ./data:/data
    environment:
      VIREO_LLM_BASE_URL: ${VIREO_LLM_BASE_URL:-http://litellm:4000/v1}
      VIREO_LLM_API_KEY: ${VIREO_LLM_API_KEY:-${LITELLM_MASTER_KEY:-sk-vireo-local}}
      VIREO_MODEL: ${VIREO_MODEL:-}
      VIREO_FAST_MODEL: ${VIREO_FAST_MODEL:-}
      VIREO_NAME: ${VIREO_NAME:-}
      TZ: ${TZ:-UTC}
    depends_on:
      litellm:
        condition: service_started
        required: false

  app:
    build:
      context: .
      target: web
    image: vireo-web:local
    restart: unless-stopped
    ports:
      - "8780:8780"
    environment:
      VIREO_HOST_URL: http://host:8787
    depends_on:
      - host

  litellm:
    image: ghcr.io/berriai/litellm:main-v1.83.14-stable
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ./deploy/litellm.config.yaml:/app/config.yaml:ro
    env_file:
      - path: .env
        required: false
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-vireo-local}
    extra_hosts:
      - "host.docker.internal:host-gateway"
